spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:covoiturage_db}
    driverClassName: org.postgresql.Driver
    username: ${DB_USER:covoiturage}
    password: ${DB_PASSWORD:covoiturage_secret}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
